<body class="bg-primary-container text-on-primary-container min-h-screen flex items-center justify-center relative overflow-hidden font-body-md selection:bg-on-tertiary-container selection:text-tertiary">
<!-- Procedural Background Elements -->
<div class="absolute inset-0 bg-procedural z-0 pointer-events-none"></div>
<div class="absolute top-0 left-0 w-full h-2 bg-on-tertiary-container z-0"></div>
<div class="absolute bottom-0 left-0 w-full h-4 border-t-2 border-primary-fixed-dim z-0 bg-primary"></div>
<!-- Side Annotations (Maximalist Density) -->
<div class="absolute left-margin top-margin hidden lg:flex flex-col gap-unit font-label-caps text-on-primary-container/40 z-0">
<span class="flex items-center gap-2"><span class="w-2 h-2 bg-on-tertiary-container rounded-full"></span> SYSTEM ONLINE</span>
<span>NODE: KL-TRV-01</span>
<span>ENCRYPTION: AES-256</span>
</div>
<div class="absolute right-margin bottom-margin hidden lg:flex flex-col items-end gap-unit font-label-caps text-on-primary-container/40 z-0 text-right">

<span>IP LOGGED &amp; MONITORED</span>
<span class="mt-4 border-t border-on-primary-container/20 pt-2 block w-24"></span>
</div>
<!-- Main Centered Access Panel -->
<main class="relative z-10 w-full max-w-[540px] px-gutter">
<!-- Archival Tab -->
<div class="absolute -top-6 left-gutter ml-2 bg-surface text-primary border-t-2 border-l-2 border-r-2 border-primary font-label-caps px-4 py-1 z-20">
            AUTH_REQ_ST
        </div>
<!-- Warning Ribbon -->
<div class="absolute top-4 left-1/2 -translate-x-1/2 bg-error text-on-error font-label-caps px-6 py-2 border-2 border-primary shadow-[4px_4px_0px_0px_rgba(0,13,41,1)] whitespace-nowrap z-30 uppercase tracking-widest flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">warning</span>
            GOVERNMENT OFFICIALS ONLY
        </div>
<!-- Double Border Outer Shell -->
<div class="bg-surface p-1 border-4 border-primary border-double shadow-[12px_12px_0px_0px_rgba(0,0,0,0.5)]">
<!-- Inner Structural Frame -->
<div class="border border-primary p-panel-padding pt-16 relative overflow-hidden bg-surface flex flex-col items-center text-center">
<!-- Watermark -->
<span class="material-symbols-outlined absolute text-[240px] text-surface-container-highest opacity-30 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none" style="font-variation-settings: 'FILL' 1;">gavel</span>

<div class="relative z-10 w-full flex flex-col items-center mb-8">

<span>THUNA</span>
<span class="text-secondary opacity-50 font-light mx-2">|</span>
<span>തുണ</span>
</h1>
<h2 class="font-headline-md text-primary uppercase tracking-tight leading-tight">
                        SECURE ACCESS PORTAL
                    </h2>
<p class="font-body-lg text-secondary mt-1">സുരക്ഷിത ആക്സസ് പോർട്ടൽ</p>
</div>
<!-- Structural Divider -->
<div class="w-full h-px bg-outline-variant my-2 relative z-10">
<div class="absolute left-1/2 -translate-x-1/2 -top-3 bg-surface px-2 text-outline font-label-caps">IDENTIFICATION</div>
</div>
<!-- Primary Action -->
<div class="w-full relative z-10 mt-8 mb-4">
<button class="w-full border-2 border-primary bg-surface text-primary py-4 px-6 font-label-caps uppercase tracking-widest hover:bg-primary hover:text-on-primary hover:border-primary shadow-[4px_4px_0px_0px_rgba(177,130,44,1)] hover:shadow-none hover:translate-y-1 hover:translate-x-1 transition-all flex items-center justify-center gap-4 group">
<span class="material-symbols-outlined text-[20px]">login</span>
<span>Sign in with Google</span>
<span class="material-symbols-outlined text-[16px] opacity-0 group-hover:opacity-100 transition-opacity ml-auto">arrow_forward</span>
</button>
</div>

<div class="w-full mt-6 flex justify-between items-end border-t border-primary/20 pt-4 font-label-caps text-[10px] text-outline relative z-10">
<div class="flex flex-col items-start text-left gap-1">

</div>
